[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llms-start"
version = "0.1.0"
description = "Learning projects for language model training, semantic IDs, and classification."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "tiktoken",
    "torch",
]

[project.optional-dependencies]
classification = [
    "accelerate",
    "datasets",
    "transformers",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]
